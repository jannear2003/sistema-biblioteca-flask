{% extends "base.html" %}
{% block content %}

<h2 class="mb-3">Usuarios</h2>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<form method="POST" class="card p-4 mb-4 shadow-sm">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input class="form-control" type="text" name="nombre" placeholder="Ingrese el nombre" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input class="form-control" type="email" name="correo" placeholder="Ingrese el correo" required>
    </div>

    <button class="btn btn-success" type="submit">
        Agregar Usuario
    </button>

</form>

<ul class="list-group">
    {% for u in usuarios %}
    <li class="list-group-item d-flex justify-content-between">
        <span>{{ u.nombre }}</span>
        <span class="text-muted">{{ u.correo }}</span>
    </li>
    {% endfor %}
</ul>

{% endblock %}
